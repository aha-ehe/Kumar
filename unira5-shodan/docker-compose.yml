version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: unira5-es
    environment:
      - node.name=unira5-es
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - shodan-net
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: unira5-redis
    networks:
      - shodan-net
    restart: unless-stopped

  worker:
    build: ./worker
    container_name: unira5-worker
    depends_on:
      - redis
      - elasticsearch
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GEOIP_LICENSE_KEY=${GEOIP_LICENSE_KEY:-placeholder}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - shodan-net
    restart: unless-stopped

  api:
    build: ./api
    container_name: unira5-api
    depends_on:
      - redis
      - elasticsearch
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-changeme}
    ports:
      - "8000:8000"
    networks:
      - shodan-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: unira5-frontend
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8759/api
    networks:
      - shodan-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: unira5-nginx
    ports:
      - "8759:8759"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - shodan-net
    restart: unless-stopped

volumes:
  es_data:

networks:
  shodan-net:
    driver: bridge
